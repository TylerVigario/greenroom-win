name: Release

# One manual run does the whole release, publication first and the record after: the
# version, release notes and changelog built into a commit and annotated tag on the
# runner; the module published to the PowerShell Gallery; then the commit and tag pushed
# together and the GitHub Release created. There is no release pull request — the bump
# lands on main directly, as one commit produced from commits that already passed the
# gate.
#
# THE GALLERY IS THE PRODUCT. Everything before it is bookkeeping: what an operator
# actually consumes is `Install-PSResource Greenroom`, so a release that tags but does not
# publish has not shipped.
#
# WHY THIS NEEDS A GITHUB APP.
#
# main refuses direct writes, and a release moves it to the version commit, so something
# has to be allowed through. The App is a bypass
# actor on the ruleset, and the exemption is deliberately narrow in what it is used for:
# one commit containing only CHANGELOG.md and the manifest. Nothing else in this
# repository uses the App, and no other workflow reads its secrets.
#
# The honest cost, stated because it is real: a ruleset bypass belongs to the ACTOR, not
# to this workflow. Any workflow that can mint this App's token can push to main
# unreviewed — including one added by a future pull request, since the gate checks the
# tree and not what a new workflow reads.
#
# That is why the secrets live on the `release` ENVIRONMENT rather than repo-wide, and why
# this job names it below. The environment is limited to `main`, so a modified release.yml
# dispatched from a branch cannot reach the secrets at all.
#
# It carries NO required reviewer, deliberately. While one person maintains the repository,
# anyone able to start a run on main is that person, so an approval step asks them to
# approve themselves -- a click, not a gate. Revisit when a contributor holds write access:
# from then on a reviewer on this environment is what stands between their dispatch and the
# secrets.
#
# What that does NOT contain: the bypass is `always`, which GitHub applies to every rule in
# the ruleset rather than only the pull-request one — so the App could in principle also
# force-push or delete main, not merely skip review. Splitting main-protection into two
# rulesets (PR + checks with the bypass, integrity rules without) would scope that down.
# Judged not worth the second apply step for a solo repository; revisit if that changes.
#
# WHY NOT A PAT: a PAT is a person's credential with that person's reach, it expires, and
# it does not survive them. An App installation token is scoped to this repository, lasts
# an hour, and is auditable as itself.
#
# SETUP, done once by the repository owner and recorded here so it can be rebuilt:
#   1. A GitHub App owned by @TylerVigario — `greenroom-release`, App ID 5068384.
#      Repository permissions: Contents: Read and write, and nothing else; webhook off.
#      Contents covers the commit, the tag AND publishing the Release; they are one
#      permission, so nothing further is needed.
#   2. Installed on greenroom-win only.
#      AN INSTALLATION DOES NOT TRAVEL WITH A REPOSITORY TRANSFER. It belongs to the
#      account that installed it, so moving the repository between owners leaves it
#      behind. MEASURED on the move out of the Vigario-Technology-Solutions org: the
#      credentials were still valid -- the App JWT was accepted -- and the mint failed
#      anyway with `Integration not found`, a 404 from
#      GET /repos/<owner>/<repo>/installation. Re-install on the new owner.
#      If the App was REPLACED rather than moved, its App ID changed with it, so step 4
#      and both environment secrets belong to whichever App the ruleset now names.
#   3. A `release` environment on the repository — limited to the `main` branch, no
#      required reviewer (see above) — carrying RELEASE_APP_CLIENT_ID,
#      RELEASE_APP_PRIVATE_KEY and PSGALLERY_API_KEY as ENVIRONMENT secrets, not
#      repository secrets, per the paragraph above.
#      The Client ID is NOT the App ID. The Client ID is the `Iv23li...` value and goes
#      in the secret; the App ID is the number beside it and goes in the ruleset.
#      PSGALLERY_API_KEY comes from powershellgallery.com -> your account -> API Keys.
#      Scope it to Push for the Greenroom package only; PSGallery keys can be scoped per
#      package and given an expiry, and a key that can push anything is a key that can
#      replace anything you own.
#   4. The App added to `bypass_actors` in .github/rulesets/main.json BY ITS APP ID, and
#      the ruleset then re-applied — that payload is source of truth, not applied state,
#      so editing it changes nothing until:
#        gh api repos/<org>/<repo>/rulesets/<id> --method PUT --input .github/rulesets/main.json
#      Re-apply only after the App is installed: GitHub rejects a bypass actor it cannot
#      resolve, and the whole PUT fails with a 422.
#
# Dry-run first. `dry-run: true` exercises the token mint, the checkout, `cog check`, the
# version derivation, the bump on the runner, and GitHub constructing and signing the
# version commit on a temporary branch, which it then deletes. It publishes nothing and
# records nothing, so it needs neither the bypass nor the re-apply — it proves everything
# except the two steps that cannot be rehearsed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, or "auto" to derive it from the commits'
        required: true
        default: 'auto'
        type: string
      dry-run:
        description: 'Work out the version and changelog, change nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # the App token does the writing, not GITHUB_TOKEN

env:
  # The version names a release asset, and cocogitto's releases are not immutable, so
  # the file behind a version can be replaced. The checksum names the bytes: a download
  # that does not match stops the step before cog runs. Bump both together -- the
  # digest GitHub shows for the x86_64-unknown-linux-musl asset on that release.
  COG_VERSION: '7.0.0'
  COG_SHA256: 'e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb'

jobs:
  release:
    runs-on: ubuntu-latest
    # The App secrets live on the `release` environment -- a job must name the environment to
    # read its secrets. The environment restricts deployments to `main`, so a release.yml
    # dispatched from a branch cannot reach the secrets at all.
    environment: release
    # The attestation is signed with this run's OIDC identity and stored on the repository;
    # those are the two things the job needs beyond reading. Everything that writes to the
    # repository itself does so with the App token, not GITHUB_TOKEN.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Mint an App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not `app-id`: the action carries deprecationMessage
          # "Use 'client-id' instead" on the latter. They are DIFFERENT VALUES --
          # the App ID is numeric, the Client ID looks like `Iv23li...` -- so this
          # is not the same secret under a new name.
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the minted token below whatever the App was granted. The App should
          # hold Contents: Read and write and nothing else, but this makes the scope
          # explicit at the point of use and survives someone widening the App later.
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: cog derives the next version from the commits since the last tag
          # and generates the changelog from the same range.
          fetch-depth: 0
          # TAGS ARE NOT OPTIONAL HERE. Without them cog sees an untagged repository and
          # computes a first release -- generating a changelog from the very first commit,
          # which is exactly what 0.1.0 was hand-cut to avoid. `fetch-depth: 0` already
          # brings them; stating it means a later change to the depth cannot quietly
          # remove them.
          fetch-tags: true
          # Nothing is pushed from this checkout: the version commit, the tag and the move of
          # main all go through the API with the App token. So the token is not left in
          # .git/config, where every later step could read it.
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
          ref: main

      # THE PRECONDITION THE REST OF THIS WORKFLOW ASSUMED WITHOUT CHECKING.
      #
      # Everything below is careful about failing before the point of no return, and yet
      # the most important precondition -- the code works -- was never asked. `ref: main`
      # plus branch protection was taken as proof, and it is not:
      #
      #   * `strict_required_status_checks_policy` is FALSE, so a branch need not be up to
      #     date with main before merging. Two pull requests can each pass on their own and
      #     the COMBINATION on main is never tested before it lands.
      #   * CI does run on push to main, which catches that -- but nothing consulted the
      #     result, so a red main released exactly as happily as a green one.
      #   * the release App bypasses the ruleset, so "everything on main passed checks" is
      #     not literally true.
      #
      # A published gallery version can be unlisted but never deleted, so shipping from a
      # red commit is not something a re-run fixes.
      #
      # The required contexts are read from the ruleset payload rather than restated here:
      # that file is the source of truth for what must pass, and a second copy would drift.
      - name: Verify the commit being released is green
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Output "releasing $sha"
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $payload  = Get-Content .github/rulesets/main.json -Raw | ConvertFrom-Json
          # `.context` on that array is PowerShell MEMBER ENUMERATION: it returns the
          # property from every element, so this yields the seven context strings rather
          # than $null. Verified against the real payload -- 7 values, no empties.
          #
          # The Where-Object is defensive, not a fix: a malformed entry carrying no context
          # would otherwise surface as a nameless "-- never reported" line, which is a
          # confusing way to discover the payload is wrong. The json gate phase would
          # normally catch that long before a release.
          $required = @($payload.rules |
              Where-Object { $_.type -eq 'required_status_checks' } |
              ForEach-Object { $_.parameters.required_status_checks.context } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($required.Count -eq 0) { throw 'no required contexts found in the ruleset payload' }

          # @tsv, not an interpolated jq string: a backtick-t inside single quotes is a
          # PowerShell escape that PowerShell never applies, so jq received a literal
          # backtick and emitted no tabs -- every context then parsed as "never reported"
          # and the guard refused a genuinely green commit. Measured, not theorised.
          $lines = @(gh api "repos/$env:GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate `
                       --jq '.check_runs[] | [.name, .status, .conclusion] | @tsv')
          $runs = @{}
          foreach ($l in $lines) {
              $n, $status, $conclusion = $l -split "`t"
              # Keep the most recent result for a name; re-runs report more than once.
              if (-not $runs.ContainsKey($n)) { $runs[$n] = @{ Status = $status; Conclusion = $conclusion } }
          }

          $bad = @()
          foreach ($c in $required) {
              $r = $runs[$c]
              if (-not $r)                        { $bad += "$c -- never reported"; continue }
              if ($r.Status -ne 'completed')      { $bad += "$c -- still $($r.Status)"; continue }
              switch ($r.Conclusion) {
                  'success' { Write-Output "  ok      $c" }
                  # `pr-title` cannot run on a push to main, so it reports skipped there.
                  # Accept it, but SAY so: a check that silently did not run is the thing
                  # this guard exists to notice.
                  'skipped' { Write-Output "  skipped $c  (did not run on this commit)" }
                  default   { $bad += "$c -- $($r.Conclusion)" }
              }
          }

          if ($bad.Count -gt 0) {
              Write-Output ''
              throw ("refusing to release $sha, required checks are not green:`n  " +
                     ($bad -join "`n  ") +
                     "`nA published version can be unlisted but never deleted, so this is not " +
                     'something a re-run undoes. Fix main, let CI go green, then dispatch again.')
          }
          Write-Output "all $($required.Count) required checks are green"

      - name: Install cocogitto
        run: |
          set -euo pipefail
          url="https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/cog.tar.gz"
          echo "$COG_SHA256  $RUNNER_TEMP/cog.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/cog.tar.gz" --strip-components=1 -C /usr/local/bin x86_64-unknown-linux-musl/cog
          cog --version

      # cog PANICS without a git identity, even when only linting a string:
      #   called `Result::unwrap()` on an Err value: "config value 'user.name' was not found"
      # exit 134, a core dump rather than an error. A runner has no identity by default.
      #
      # The bump commit made here never leaves the runner -- GitHub constructs the one that is
      # recorded -- but cog needs an identity to make it, and the App's is the true one.
      - name: Identify as the release App
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git config user.name  "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"

      # EVERYTHING THAT CAN FAIL SHOULD FAIL HERE, before anything is created.
      #
      # cog check proves history parses; the dry run proves a version can be derived and
      # that the branch whitelist allows this branch; the tag check catches a re-run of a
      # release that already happened, which would otherwise fail at recording.
      - name: Pre-flight
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cog check
          if [ "$VERSION" = "auto" ]; then
            next=$(cog bump --auto --dry-run)
          else
            next=$(cog bump --version "$VERSION" --dry-run)
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists as a tag"; exit 1
          fi

      # BUILD THE RELEASE ON THE RUNNER. cog bump runs the pre-bump hook (ModuleVersion and
      # release notes into the manifest), prepends the changelog, commits, and creates the
      # annotated tag -- and nothing else: cog.toml has no post-bump hook, so nothing leaves
      # the runner here. A failure at any point is the same as nothing having happened, which
      # is also why this runs on a dry run.
      #
      # Annotated, not lightweight: a tag object records who tagged the release and when,
      # which a bare ref cannot. Keeping the tag where it was put is not the tag type's
      # job -- the tag ruleset's `update` rule refuses any move of an existing tag.
      - name: Build the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "auto" ]; then
            cog bump --auto --annotated "greenroom-win {{version}}"
          else
            cog bump --version "$VERSION" --annotated "greenroom-win {{version}}"
          fi

      # THE CHANGELOG IS REGENERATED, NOT TAKEN FROM THE BUMP. The section cog bump writes links
      # its compare range from the release's first commit instead of the previous tag, and is
      # dated by the last change merged rather than the release (cocogitto/cocogitto#579). A
      # full `cog changelog` gets both right -- see ci/write-changelog.ps1. It needs the new
      # tag on HEAD, so it runs here, and the result is folded into the bump commit before
      # GitHub is asked to construct it. Nothing leaves the runner, so this runs on a dry run.
      - name: Regenerate the changelog
        env:
          TAG: ${{ steps.plan.outputs.next }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -File ./ci/write-changelog.ps1
          git add CHANGELOG.md
          git commit --amend --no-edit --quiet
          git tag --force --annotate "$TAG" --message "greenroom-win ${TAG#v}" >/dev/null

      # GITHUB BUILDS THE COMMIT THAT GETS RECORDED. A commit pushed from here would arrive
      # unsigned whatever token pushed it; one GitHub constructs through the API, given no
      # author, committer or signature, carries GitHub's signature. createCommitOnBranch
      # needs a branch, so it builds on `release/<tag>` -- started at the green commit,
      # outside every ruleset, and deleted at the end of the run.
      #
      # Checked BEFORE anything is published, because afterwards it is too late to care:
      # the tree GitHub built must be the tree the runner built, id for id, and the commit
      # must carry a valid signature. Either failing stops the release with nothing
      # published. Runs on a dry run too -- nothing it creates is referenced by main or by
      # a tag, and the branch is deleted.
      - name: Have GitHub construct the version commit
        id: construct
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ steps.gate.outputs.sha }}
          BRANCH: release/${{ steps.plan.outputs.next }}
        run: |
          set -euo pipefail

          # The local bump must sit directly on the commit that was verified green.
          [ "$(git rev-parse HEAD~1)" = "$BASE" ] || { echo "::error::the local bump is not on $BASE"; exit 1; }

          # A branch to build on, starting at the green commit. Not the default branch, so no
          # ruleset governs it; it is deleted at the end of the run whatever happens.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$BASE" --silent
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          # Every file the bump changed, byte for byte. No author, committer or signature is
          # supplied: GitHub constructs the commit and signs it.
          additions=$(git diff --name-only HEAD~1 HEAD | while IFS= read -r path; do
            git cat-file blob "HEAD:$path" | base64 -w0 | jq -Rs --arg p "$path" '{path: $p, contents: .}'
          done | jq -s .)
          query='mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) { commit { oid tree { oid } signature { isValid signer { login } } } } }'
          commit=$(jq -n --arg q "$query" --arg repo "$GITHUB_REPOSITORY" --arg b "$BRANCH" --arg h "$BASE" \
                        --arg head "$(git log -1 --format=%s)" --argjson adds "$additions" \
            '{query: $q, variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $b},
              expectedHeadOid: $h, message: {headline: $head}, fileChanges: {additions: $adds}}}}' \
            | gh api graphql --input - --jq .data.createCommitOnBranch.commit)

          sha=$(jq -r .oid <<<"$commit")
          tree=$(jq -r .tree.oid <<<"$commit")
          valid=$(jq -r '.signature.isValid // false' <<<"$commit")
          signer=$(jq -r '.signature.signer.login // "nobody"' <<<"$commit")
          echo "constructed $sha -- tree $tree, signed by $signer, valid=$valid"

          # What gets published must be exactly what gets recorded: the same tree, to the byte.
          [ "$tree" = "$(git rev-parse 'HEAD^{tree}')" ] || { echo "::error::GitHub built tree $tree, not the runner's $(git rev-parse 'HEAD^{tree}')"; exit 1; }
          [ "$valid" = "true" ] || { echo "::error::the version commit is not signed"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Provisioning is a NAMED STEP rather than something the publish does on its way
      # past, for the same reason the check jobs declare their modules: a runner image that
      # stops shipping PSResourceGet should fail HERE, in a step about dependencies.
      #
      # Present is not enough: packing once needs Compress-PSResource and
      # `Publish-PSResource -NupkgPath`, which older PSResourceGet does not have. So the check
      # is for the command, and an install that still lacks it fails here.
      - name: Ensure PSResourceGet
        shell: pwsh
        run: |
          if (Get-Command Compress-PSResource -ErrorAction SilentlyContinue) {
            Write-Host "PSResourceGet: present, $((Get-Command Compress-PSResource).Version)"
          }
          else {
            Write-Host "PSResourceGet: installing"
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
            Import-Module Microsoft.PowerShell.PSResourceGet -Force
            if (-not (Get-Command Compress-PSResource -ErrorAction SilentlyContinue)) {
              throw 'PSResourceGet has no Compress-PSResource; the package cannot be packed once'
            }
          }

      # PACKED ONCE, and that one file goes everywhere: attested, published to the gallery,
      # attached to the GitHub Release. Packing is not reproducible -- the same tree packed
      # twice differs in timestamps and a generated file name -- so a second pack would be a
      # different artifact, and an attestation for one says nothing about the other.
      #
      # Packed from the tree the construct step proved identical to the commit GitHub built,
      # so the package, the tag and the attestation all describe the same source. A dry run
      # packs too, which proves the step; it attests and publishes nothing.
      - name: Pack the module
        id: pack
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'package'
          New-Item -ItemType Directory -Force $out | Out-Null
          Compress-PSResource -Path ./Greenroom -DestinationPath $out -ErrorAction Stop
          $pkg = @(Get-ChildItem $out -Filter *.nupkg)
          if ($pkg.Count -ne 1) { throw "expected one package in $out, found $($pkg.Count)" }
          $sha = (Get-FileHash $pkg[0].FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "packed $($pkg[0].Name) sha256:$sha"
          "nupkg=$($pkg[0].FullName)" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT

      # PROVENANCE, BEFORE PUBLICATION. The attestation binds the package's digest to this
      # workflow, this commit and this run, signed and entered in a public transparency log.
      # It exists at publication or never -- it cannot be added to a version afterwards -- so
      # it comes first: nothing reaches the gallery unattested.
      #
      # If the publish then fails, a re-run packs again, and the new bytes get their own
      # attestation. The first one names bytes no channel serves, so no hash anyone computes
      # will ever match it; it cannot vouch for something that was installed.
      - name: Attest the package
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.nupkg }}

      # THE POINT OF NO RETURN, and it comes FIRST. PSGallery does not allow a version to be
      # replaced, only deprecated, so publishing is the one step nothing can take back. The
      # record of a release -- the bump on main, the tag, the GitHub Release -- follows it
      # and never precedes it: recorded first, a failed publish would leave the repository
      # asserting a release nobody can install.
      #
      # The package packed above, byte for byte: `-NupkgPath` publishes a file as it is
      # rather than packing again, and the gallery serves exactly what it stored. A FAILED publish leaves nothing behind -- nothing has been pushed --
      # and the whole workflow re-runs. A SUCCEEDED one makes a re-run fail here, as the
      # pre-flight tag check does for the tag.
      #
      # Deliberately not `continue-on-error`: a release whose module never reached the
      # gallery has not shipped, and it should be loud rather than a green tick.
      - name: Publish to the PowerShell Gallery
        if: ${{ !inputs.dry-run }}
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          Publish-PSResource -NupkgPath $env:NUPKG -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
          Write-Host "published $(Split-Path $env:NUPKG -Leaf) to PSGallery"

      # RECORD WHAT WAS PUBLISHED: the tag first, then main.
      #
      # The tag goes on the commit GitHub constructed -- the exact bits the gallery now
      # carries -- before main is touched, so whatever happens next, the version names what
      # shipped. An annotated tag object, tagged by the App, then its ref.
      #
      # Then main is moved to that commit, never forced. If main moved since the green check,
      # this is refused: the release is published and tagged, and only main lacks the bump,
      # which is landed by hand. That failure is loud and recoverable; a forced move would
      # silently drop whatever landed in between.
      - name: Record the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.next }}
          COMMIT: ${{ steps.construct.outputs.sha }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          object=$(jq -n --arg t "$TAG" --arg m "greenroom-win ${TAG#v}" --arg o "$COMMIT" \
                        --arg n "$APP_SLUG[bot]" --arg e "$APP_SLUG[bot]@users.noreply.github.com" \
                        --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{tag: $t, message: $m, object: $o, type: "commit", tagger: {name: $n, email: $e, date: $d}}' \
            | gh api "$repo/git/tags" --input - --jq .sha)
          gh api "$repo/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" --silent
          echo "tagged $TAG -> $COMMIT"
          if ! gh api -X PATCH "$repo/git/refs/heads/main" -f sha="$COMMIT" -F force=false --silent; then
            echo "::error::$TAG is published and tagged at $COMMIT, but main could not be moved to it -- main has moved since the green check. Land the bump on main by hand."
            exit 1
          fi
          echo "main -> $COMMIT"

      # Last, once the tag exists on the server. The notes ARE the new release's section of
      # CHANGELOG.md, cut from the file this run regenerated -- the file in the tree GitHub was
      # checked to have built, byte for byte -- so the Release page and CHANGELOG.md cannot
      # drift apart. Rendering them again with `cog changelog --at` would bring back both
      # faults the regeneration exists to fix (the first-commit compare link and, from this
      # checkout, a version entry citing the runner's own bump commit, which never exists on
      # GitHub: v0.7.0's notes cited dfb7913 for the recorded d2bbf37).
      #
      # Draft first, attach the package, publish last. Releases here are immutable, and
      # publication is where the freeze falls: the tag and the asset cannot change after it.
      # The asset is the same file the gallery got, so anyone can hash what they were served
      # and compare it with a copy whose attestation they can check.
      - name: Publish the GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.next }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          set -euo pipefail
          # From this release's heading to the separator that ends its section.
          awk -v h="## [$TAG]" 'index($0, h) == 1 { on = 1 } on && $0 == "- - -" { exit } on' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || { echo "::error::no $TAG section in CHANGELOG.md"; exit 1; }
          gh release create "$TAG" --draft --title "$TAG" --notes-file /tmp/notes.md --verify-tag
          gh release upload "$TAG" "$NUPKG"
          gh release edit "$TAG" --draft=false

      # The build branch has done its job once the commit exists, or failed to. Deleted on
      # every outcome, including a dry run and a failure, so a re-run can create it again.
      - name: Delete the build branch
        if: ${{ always() && steps.construct.outputs.branch != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.construct.outputs.branch }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" --silent

      - name: Summary
        run: |
          {
            echo "### ${{ steps.plan.outputs.next }}"
            echo
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "Dry run — GitHub constructed and signed \`${{ steps.construct.outputs.sha }}\` on a temporary branch, since deleted, and the module packed. Nothing was attested, published or recorded."
            else
              echo "Released. The tag, the changelog and ModuleVersion moved together."
              echo "From commit \`${{ steps.gate.outputs.sha }}\`, verified green before anything was created, and recorded as \`${{ steps.construct.outputs.sha }}\`, which GitHub constructed and signed."
              echo "Package sha256 \`${{ steps.pack.outputs.sha256 }}\` — attested, published to the gallery and attached to the release."
              echo
              echo '```powershell'
              echo "Update-PSResource Greenroom     # or Install-PSResource Greenroom -TrustRepository"
              echo "Update-GreenroomInstance        # move instances onto it"
              echo '```'
              echo
              echo "PSGallery takes a few minutes to index a new version before it can be installed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
