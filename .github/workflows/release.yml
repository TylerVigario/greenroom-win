name: Release

# One manual run does the whole release: version into the manifest, changelog, commit,
# annotated tag, both refs pushed together, GitHub Release, and the module published to
# the PowerShell Gallery. There is no release pull request — the bump lands on main
# directly, as one commit produced from commits that already passed the gate.
#
# THE GALLERY IS THE PRODUCT. Everything before it is bookkeeping: what an operator
# actually consumes is `Install-PSResource Greenroom`, so a release that tags but does not
# publish has not shipped.
#
# WHY THIS NEEDS A GITHUB APP.
#
# main refuses direct pushes, so something has to be allowed through. The App is a bypass
# actor on the ruleset, and the exemption is deliberately narrow in what it is used for:
# one commit containing only CHANGELOG.md and the manifest. Nothing else in this
# repository uses the App, and no other workflow reads its secrets.
#
# The honest cost, stated because it is real: a ruleset bypass belongs to the ACTOR, not
# to this workflow. Any workflow that can mint this App's token can push to main
# unreviewed — including one added by a future pull request, since the gate checks the
# tree and not what a new workflow reads.
#
# That is why the secrets live on the `release` ENVIRONMENT rather than repo-wide, and why
# this job names it below. The environment carries a required reviewer, so a run stalls
# until a human approves before it can mint the token, and it is limited to `main`, so a
# modified release.yml dispatched from a branch cannot reach the secrets at all.
#
# What that does NOT contain: the bypass is `always`, which GitHub applies to every rule in
# the ruleset rather than only the pull-request one — so the App could in principle also
# force-push or delete main, not merely skip review. Splitting main-protection into two
# rulesets (PR + checks with the bypass, integrity rules without) would scope that down.
# Judged not worth the second apply step for a solo repository; revisit if that changes.
#
# WHY NOT A PAT: a PAT is a person's credential with that person's reach, it expires, and
# it does not survive them. An App installation token is scoped to this repository, lasts
# an hour, and is auditable as itself.
#
# SETUP, done once by the repository owner and recorded here so it can be rebuilt:
#   1. A GitHub App owned by @TylerVigario — `greenroom-release`, App ID 5068384.
#      Repository permissions: Contents: Read and write, and nothing else; webhook off.
#      Contents covers the commit, the tag AND publishing the Release; they are one
#      permission, so nothing further is needed.
#   2. Installed on greenroom-win only.
#      AN INSTALLATION DOES NOT TRAVEL WITH A REPOSITORY TRANSFER. It belongs to the
#      account that installed it, so moving the repository between owners leaves it
#      behind. MEASURED on the move out of the Vigario-Technology-Solutions org: the
#      credentials were still valid -- the App JWT was accepted -- and the mint failed
#      anyway with `Integration not found`, a 404 from
#      GET /repos/<owner>/<repo>/installation. Re-install on the new owner.
#      If the App was REPLACED rather than moved, its App ID changed with it, so step 4
#      and both environment secrets belong to whichever App the ruleset now names.
#   3. A `release` environment on the repository — required reviewer, limited to the
#      `main` branch — carrying RELEASE_APP_CLIENT_ID, RELEASE_APP_PRIVATE_KEY and
#      PSGALLERY_API_KEY as ENVIRONMENT secrets, not repository secrets, per the
#      paragraph above.
#      The Client ID is NOT the App ID. The Client ID is the `Iv23li...` value and goes
#      in the secret; the App ID is the number beside it and goes in the ruleset.
#      PSGALLERY_API_KEY comes from powershellgallery.com -> your account -> API Keys.
#      Scope it to Push for the Greenroom package only; PSGallery keys can be scoped per
#      package and given an expiry, and a key that can push anything is a key that can
#      replace anything you own.
#   4. The App added to `bypass_actors` in .github/rulesets/main.json BY ITS APP ID, and
#      the ruleset then re-applied — that payload is source of truth, not applied state,
#      so editing it changes nothing until:
#        gh api repos/<org>/<repo>/rulesets/<id> --method PUT --input .github/rulesets/main.json
#      Re-apply only after the App is installed: GitHub rejects a bypass actor it cannot
#      resolve, and the whole PUT fails with a 422.
#
# Dry-run first. `dry-run: true` exercises the token mint, the checkout, `cog check` and the
# version derivation without pushing, so it needs neither the bypass nor the re-apply — it
# proves everything except the one step that cannot be rehearsed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, or "auto" to derive it from the commits'
        required: true
        default: 'auto'
        type: string
      dry-run:
        description: 'Work out the version and changelog, change nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read   # the App token does the writing, not GITHUB_TOKEN

env:
  COG_VERSION: '7.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    # The App secrets live on the `release` environment, behind a required reviewer, so this
    # job pauses for approval before it can mint the App token -- a job must name the
    # environment to read its secrets. The environment also restricts deployments to `main`,
    # so a release.yml dispatched from a branch cannot reach the secrets at all.
    environment: release
    steps:
      - name: Mint an App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          # `client-id`, not `app-id`: the action carries deprecationMessage
          # "Use 'client-id' instead" on the latter. They are DIFFERENT VALUES --
          # the App ID is numeric, the Client ID looks like `Iv23li...` -- so this
          # is not the same secret under a new name.
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the minted token below whatever the App was granted. The App should
          # hold Contents: Read and write and nothing else, but this makes the scope
          # explicit at the point of use and survives someone widening the App later.
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          # Full history: cog derives the next version from the commits since the last tag
          # and generates the changelog from the same range.
          fetch-depth: 0
          # TAGS ARE NOT OPTIONAL HERE. Without them cog sees an untagged repository and
          # computes a first release -- generating a changelog from the very first commit,
          # which is exactly what 0.1.0 was hand-cut to avoid. `fetch-depth: 0` already
          # brings them; stating it means a later change to the depth cannot quietly
          # remove them.
          fetch-tags: true
          # Checked out WITH the App token, and `persist-credentials` defaults to true, so
          # the token lands in .git/config and cog's push authenticates as the App -- the
          # identity the ruleset bypasses. Setting persist-credentials: false here would
          # break the release at the point of no return, not at checkout.
          token: ${{ steps.app.outputs.token }}
          ref: main

      # THE PRECONDITION THE REST OF THIS WORKFLOW ASSUMED WITHOUT CHECKING.
      #
      # Everything below is careful about failing before the point of no return, and yet
      # the most important precondition -- the code works -- was never asked. `ref: main`
      # plus branch protection was taken as proof, and it is not:
      #
      #   * `strict_required_status_checks_policy` is FALSE, so a branch need not be up to
      #     date with main before merging. Two pull requests can each pass on their own and
      #     the COMBINATION on main is never tested before it lands.
      #   * CI does run on push to main, which catches that -- but nothing consulted the
      #     result, so a red main released exactly as happily as a green one.
      #   * the release App bypasses the ruleset, so "everything on main passed checks" is
      #     not literally true.
      #
      # A published gallery version can be unlisted but never deleted, so shipping from a
      # red commit is not something a re-run fixes.
      #
      # The required contexts are read from the ruleset payload rather than restated here:
      # that file is the source of truth for what must pass, and a second copy would drift.
      - name: Verify the commit being released is green
        id: gate
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          Write-Output "releasing $sha"
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $payload  = Get-Content .github/rulesets/main.json -Raw | ConvertFrom-Json
          # `.context` on that array is PowerShell MEMBER ENUMERATION: it returns the
          # property from every element, so this yields the seven context strings rather
          # than $null. Verified against the real payload -- 7 values, no empties.
          #
          # The Where-Object is defensive, not a fix: a malformed entry carrying no context
          # would otherwise surface as a nameless "-- never reported" line, which is a
          # confusing way to discover the payload is wrong. The json gate phase would
          # normally catch that long before a release.
          $required = @($payload.rules |
              Where-Object { $_.type -eq 'required_status_checks' } |
              ForEach-Object { $_.parameters.required_status_checks.context } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($required.Count -eq 0) { throw 'no required contexts found in the ruleset payload' }

          # @tsv, not an interpolated jq string: a backtick-t inside single quotes is a
          # PowerShell escape that PowerShell never applies, so jq received a literal
          # backtick and emitted no tabs -- every context then parsed as "never reported"
          # and the guard refused a genuinely green commit. Measured, not theorised.
          $lines = @(gh api "repos/$env:GITHUB_REPOSITORY/commits/$sha/check-runs" --paginate `
                       --jq '.check_runs[] | [.name, .status, .conclusion] | @tsv')
          $runs = @{}
          foreach ($l in $lines) {
              $n, $status, $conclusion = $l -split "`t"
              # Keep the most recent result for a name; re-runs report more than once.
              if (-not $runs.ContainsKey($n)) { $runs[$n] = @{ Status = $status; Conclusion = $conclusion } }
          }

          $bad = @()
          foreach ($c in $required) {
              $r = $runs[$c]
              if (-not $r)                        { $bad += "$c -- never reported"; continue }
              if ($r.Status -ne 'completed')      { $bad += "$c -- still $($r.Status)"; continue }
              switch ($r.Conclusion) {
                  'success' { Write-Output "  ok      $c" }
                  # `pr-title` cannot run on a push to main, so it reports skipped there.
                  # Accept it, but SAY so: a check that silently did not run is the thing
                  # this guard exists to notice.
                  'skipped' { Write-Output "  skipped $c  (did not run on this commit)" }
                  default   { $bad += "$c -- $($r.Conclusion)" }
              }
          }

          if ($bad.Count -gt 0) {
              Write-Output ''
              throw ("refusing to release $sha, required checks are not green:`n  " +
                     ($bad -join "`n  ") +
                     "`nA published version can be unlisted but never deleted, so this is not " +
                     'something a re-run undoes. Fix main, let CI go green, then dispatch again.')
          }
          Write-Output "all $($required.Count) required checks are green"

      - name: Install cocogitto
        run: |
          set -euo pipefail
          url="https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | tar -xz --strip-components=1 -C /usr/local/bin x86_64-unknown-linux-musl/cog
          cog --version

      # cog PANICS without a git identity, even when only linting a string:
      #   called `Result::unwrap()` on an Err value: "config value 'user.name' was not found"
      # exit 134, a core dump rather than an error. A runner has no identity by default.
      #
      # The bump commit is made by the App, so it is attributable to the App rather than to
      # a person who did not write it.
      - name: Identify as the release App
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git config user.name  "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"

      # EVERYTHING THAT CAN FAIL SHOULD FAIL HERE, before anything is created.
      #
      # cog check proves history parses; the dry run proves a version can be derived and
      # that the branch whitelist allows this branch; the tag check catches a re-run of a
      # release that already happened, which would otherwise fail at the push.
      - name: Pre-flight
        id: plan
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cog check
          if [ "$VERSION" = "auto" ]; then
            next=$(cog bump --auto --dry-run)
          else
            next=$(cog bump --version "$VERSION" --dry-run)
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next already exists as a tag"; exit 1
          fi

      # THE POINT OF NO RETURN, and it is one operation.
      #
      # cog bump runs the pre-bump hooks, writes the manifest, commits, creates the
      # annotated tag, then runs the post-bump hook -- a single `git push --atomic origin
      # main v<version>`. The server takes both refs or neither, so a failure at any point
      # leaves main untouched and the whole run re-runnable. A failure BEFORE the push
      # leaves a commit and tag on a runner that is about to be destroyed, which is the
      # same thing as nothing having happened.
      #
      # Annotated, not lightweight, and deliberately: tag rules block re-pointing an
      # annotated tag because the new tag object is not a descendant of the old, while a
      # lightweight tag moved to a descendant commit is a fast-forward and would be
      # permitted.
      - name: Release
        if: ${{ !inputs.dry-run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "auto" ]; then
            cog bump --auto --annotated "greenroom-win {{version}}"
          else
            cog bump --version "$VERSION" --annotated "greenroom-win {{version}}"
          fi

      # After the atomic push this is the only step left, and it is re-runnable by hand
      # because the tag already exists. Notes come from the changelog section cog just
      # generated, so the Release page and CHANGELOG.md cannot drift apart -- they are the
      # same text.
      - name: Publish the GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.plan.outputs.next }}
        run: |
          set -euo pipefail
          cog changelog --at "$TAG" > /tmp/notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md --verify-tag

      # Provisioning is a NAMED STEP rather than something the publish does on its way
      # past, for the same reason the check jobs declare their modules: a runner image that
      # stops shipping PSResourceGet should fail HERE, in a step about dependencies.
      - name: Ensure PSResourceGet
        if: ${{ !inputs.dry-run }}
        shell: pwsh
        run: |
          if (Get-Module Microsoft.PowerShell.PSResourceGet -ListAvailable) {
            Write-Host "PSResourceGet: present"
          }
          else {
            Write-Host "PSResourceGet: installing"
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
          }

      # LAST, and after the tag exists. The manifest only carries the new ModuleVersion
      # once cog bump has written it, so publishing any earlier would ship the previous
      # version under the new tag's name.
      #
      # This is the one step that cannot be undone by re-running: PSGallery does not allow
      # a version to be replaced, only deprecated. A FAILED publish is re-runnable by hand
      # with the same command; a SUCCEEDED one makes a re-run of the whole workflow fail
      # here, exactly as the pre-flight tag check already does for the tag itself.
      #
      # Deliberately not `continue-on-error`: a release whose module never reached the
      # gallery is a half-release, and it should be loud rather than a green tick hiding a
      # tag nobody can install.
      - name: Publish to the PowerShell Gallery
        if: ${{ !inputs.dry-run }}
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) {
            throw 'PSGALLERY_API_KEY is not set on the release environment. The tag and GitHub Release already exist; publish by hand with Publish-PSResource once the secret is in place.'
          }
          Publish-PSResource -Path ./Greenroom -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ErrorAction Stop
          Write-Host "published $((Import-PowerShellDataFile ./Greenroom/Greenroom.psd1).ModuleVersion) to PSGallery"

      - name: Summary
        run: |
          {
            echo "### ${{ steps.plan.outputs.next }}"
            echo
            if [ "${{ inputs.dry-run }}" = "true" ]; then
              echo "Dry run — nothing was changed."
            else
              echo "Released. The tag, the changelog and ModuleVersion moved together."
              echo "From commit \`${{ steps.gate.outputs.sha }}\`, verified green before anything was created."
              echo
              echo '```powershell'
              echo "Update-PSResource Greenroom     # or Install-PSResource Greenroom -TrustRepository"
              echo "Update-GreenroomInstance        # move instances onto it"
              echo '```'
              echo
              echo "PSGallery takes a few minutes to index a new version before it can be installed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
