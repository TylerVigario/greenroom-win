name: CI

# Does the tree hold up. Six jobs, one per thing that can fail for its own reason -- the
# module's contract, its syntax, the payloads it ships, its static analysis, and its
# behaviour on each PowerShell edition: pwsh 7 and in-box Windows PowerShell 5.1.
#
# ONE JOB PER CHECK, not per phase-group. A job reports a single status when it ends, so
# grouping a fast check with a slow one holds the fast answer hostage: measured on this
# tree, manifest is 0.4s and test is 9.9s. That gap is small here and will not stay small
# once there is a real suite, and the fix costs nothing on a public repository where
# minutes are free.
#
# NO AGGREGATE. The required-check list is meant to BE the list of what must pass, not a
# summary of it. An aggregate reports one context in place of five and what a reviewer
# sees stops being what is enforced -- and a job missing from its `needs:` leaves
# protection reading as complete while covering less, with nothing to report the gap.
#
# The cost of that choice is real and accepted: renaming a job here is a protection
# change, and forgetting leaves the ruleset waiting on a context nothing will report. The
# json phase asserts every context in .github/rulesets/main.json resolves to a job below,
# so that mistake is a red check rather than a wedged branch.
#
# ONE FILE, because these five answer one question on one trigger. Commit convention and
# releases have different triggers and live in their own workflows. When there is a build
# to run, it belongs here too, with `needs:` on these -- artifacts are scoped to a
# workflow run, and anything downstream keyed on `workflow_run` names one workflow rather
# than enumerating five and working out whether all of them passed.
#
# NO `paths:` filter, deliberately. A required check with a path filter never reports on a
# pull request that touches nothing it matches, and the branch wedges waiting for it.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also on main, so a break introduced by a rebase merge -- which replays branch commits
  # rather than the reviewed squash -- is reported rather than discovered by the next
  # person to clone.
  push:
    branches: [main]
  # Fire the whole gate from the Actions tab without pushing a commit. Worth having
  # because re-running is otherwise scoped to a run that already exists: after a runner
  # image changes, a cached module goes stale, or a dependency is fixed outside this
  # repository, there is no commit to attach a re-run to and an empty one is a poor way
  # to ask a question.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The manifest is the module's contract: the version, the exported surface, the format
  # file. Test-ModuleManifest is the only thing that checks the declared exports actually
  # resolve, and a manifest that does not load takes the whole module with it.
  manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: just manifest
        shell: pwsh

  # A syntax error commits cleanly and only surfaces when the watchdog next tries to
  # launch a session, on a host nobody is watching. The .ps1xml is parsed as XML for the
  # same reason: a malformed format file imports fine and the view simply does not exist.
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: just parse
        shell: pwsh

  # The branch-protection payload is applied FROM THE TREE, so a malformed one is a
  # protection change that fails at apply time instead of at review time. This job also
  # asserts every required context named in that payload exists as a job in this file.
  json:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - run: just json
        shell: pwsh

  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          modules: PSScriptAnalyzer=1.21.0
      - run: just analyze
        shell: pwsh

  # WINDOWS, and not negotiable. This first ran on ubuntu-latest, reasoning that nothing
  # here executes anything -- it parses, analyses, and the tests mock every Windows call.
  # The first run disproved it: 39 of 95 tests failed with "Could not find Command
  # Get-ScheduledTask", because Pester's Mock needs the command to EXIST before it can
  # attach to it, and the ScheduledTasks cmdlets ship only on Windows. Stubbing them would
  # fake the platform; skipping them would report green while dropping 40% of the suite.
  #
  # It still does not prove a session starts -- that needs a Claude Code login, and stays
  # a manual measurement on the reference host.
  test-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
        with:
          modules: Pester=5.0.0
      - run: just test
        shell: pwsh

  # The behaviour suite again under WINDOWS POWERSHELL 5.1 -- the in-box edition -- so the
  # 5.1 floor the manifest now declares cannot rot untested. Only this phase runs on 5.1:
  # the static contract is edition-independent, and the json phase's parser
  # (System.Text.Json) is .NET Core only. Importing the module and running every test does
  # parse every .ps1 under the 5.1 parser AND exercise the runtime, which is the coverage
  # that matters -- the one place the editions diverge is JSON handling for ~/.claude.json.
  #
  # `shell: powershell` is Windows PowerShell 5.1; `pwsh` would be 7. Pester is installed
  # in a 5.1 step so it lands on the 5.1 module path -- the composite setup action installs
  # under pwsh, where 5.1 cannot see it. 5.1 ships Pester 3.4.0 and the suite needs 5+.
  test-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Ensure Pester 5+ for Windows PowerShell 5.1
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.0.0' })) {
            Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          }
      - name: test
        shell: powershell
        run: .\ci\check.ps1 -Phase test
